[project]
name = "stomp-whisperer"
version = "0.1.0"
description = "A friendlier way to browse and manage patches on a Zoom MS-50G+ pedal over USB MIDI."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "python-rtmidi>=1.5",
    "fastapi>=0.110",
    "uvicorn>=0.29",
]

[project.optional-dependencies]
dev = ["pytest", "httpx"]

[project.scripts]
stomp-whisperer = "stomp_whisperer.cli:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
stomp_whisperer = ["web/static/*"]
