<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>StompWhisperer</title>
  <link rel="stylesheet" href="style.css">
  <script src="knob.js" defer></script>
  <script src="app.js" defer></script>
</head>
<body>
  <header class="topbar">
    <h1 class="brand">Stomp<span>Whisperer</span></h1>
    <div class="status" id="status" data-state="searching">
      <span class="led" aria-hidden="true"></span>
      <span id="status-text">Looking for pedal…</span>
    </div>
  </header>

  <main class="workspace">
    <aside class="patch-list" aria-labelledby="list-title">
      <header class="panel-head">
        <h2 id="list-title">Patches</h2>
        <button type="button" class="refresh" id="refresh" title="Read the patches from the pedal again">Refresh</button>
      </header>
      <p class="list-state" id="list-state">Waiting for the pedal…</p>
      <ol class="slots" id="slots"></ol>
    </aside>

    <section class="patch-detail" id="detail" aria-live="polite">
      <p class="detail-empty">Select a patch to see its effect chain.</p>
    </section>
  </main>

  <div class="modal-backdrop" id="connect-modal" hidden>
    <div class="modal" role="dialog" aria-modal="true" aria-labelledby="modal-title" aria-describedby="modal-body">
      <svg class="modal-icon" viewBox="0 0 64 64" aria-hidden="true">
        <rect x="22" y="6" width="20" height="14" rx="2" class="plug-head"/>
        <rect x="27" y="10" width="3" height="5" class="plug-pin"/>
        <rect x="34" y="10" width="3" height="5" class="plug-pin"/>
        <rect x="18" y="20" width="28" height="16" rx="3" class="plug-body"/>
        <path d="M32 36 v8 q0 10 -12 12" class="plug-cable"/>
      </svg>
      <h2 id="modal-title">Connect your pedal</h2>
      <p id="modal-body">
        Can't find the <strong>Zoom MS-50G+</strong>. Plug it in via USB and power it on;
        this window will close by itself as soon as it's detected.
      </p>
      <p class="modal-searching"><span class="dots" aria-hidden="true"><i></i><i></i><i></i></span> Searching</p>
    </div>
  </div>
</body>
</html>
